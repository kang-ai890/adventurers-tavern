name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web
        run: npm run build -w @tavern/web
        env:
          # 后端 WebSocket 地址：Render 部署完成后填真实地址（如 https://xxx.onrender.com）
          # 未配置时前端回退到同源地址（仅静态页面可用）
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

      - name: Build admin
        run: npm run build -w @tavern/admin

      - name: Assemble dist
        run: |
          mkdir -p dist/root
          cp -r apps/web/dist/* dist/root/
          mkdir -p dist/root/admin
          cp -r apps/admin/dist/* dist/root/admin/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
